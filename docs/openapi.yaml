components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PhonePath:
      name: phone
      in: path
      required: true
      schema:
        type: string
      description: WhatsApp client phone number (without + prefix)
      example: '628192191202'

    AdminPhonePath:
      name: phone
      in: path
      required: true
      schema:
        type: string
      description: Client phone number
      example: '628192191202'

    MessageIdPath:
      name: message_id
      in: path
      required: true
      schema:
        type: string
      description: Message ID
      example: '3EB0B430B6F8F1D0E053AC120E0A9E5C'

    ChatJidPath:
      name: chat_jid
      in: path
      required: true
      schema:
        type: string
      description: Chat JID
      example: '6289685028129@s.whatsapp.net'

  schemas:
    # Auth Schemas
    AuthLoginResponse:
      type: object
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: Login successful
        results:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            expires_in:
              type: integer
              example: 3600

    # Admin Schemas
    StorageStatsResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            database_size:
              type: string
            database_size_bytes:
              type: integer
            total_chats:
              type: integer
            total_messages:
              type: integer

    CleanupResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            chats_deleted:
              type: integer
            messages_deleted:
              type: integer

    VacuumResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            size_before:
              type: string
            size_after:
              type: string
            reclaimed:
              type: string

    DeleteChatsResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            chats_deleted:
              type: integer
            messages_deleted:
              type: integer

    ClientListResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            client_count:
              type: integer
            clients:
              type: object
              additionalProperties:
                type: object

    ClientStatusResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            phone:
              type: string
            is_connected:
              type: boolean
            is_logged_in:
              type: boolean
            device_id:
              type: string

    ConnectionStatusResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            is_connected:
              type: boolean
            is_logged_in:
              type: boolean

    HistoryStatusResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            status:
              type: string
            last_sync:
              type: string

    DownloadMediaResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            url:
              type: string
            filename:
              type: string
            mime_type:
              type: string

    # Send Request Schemas
    SendMessageRequest:
      type: object
      properties:
        phone:
          type: string
          example: '6289685028129@s.whatsapp.net'
        message:
          type: string
          example: 'Hello World'
        reply_message_id:
          type: string
        is_forwarded:
          type: boolean
        duration:
          type: integer
          description: Disappearing message duration in seconds

    SendImageRequest:
      type: object
      properties:
        phone:
          type: string
        caption:
          type: string
        view_once:
          type: boolean
        image:
          type: string
          format: binary
        image_url:
          type: string
        compress:
          type: boolean

    SendFileRequest:
      type: object
      properties:
        phone:
          type: string
        caption:
          type: string
        file:
          type: string
          format: binary

    SendVideoRequest:
      type: object
      properties:
        phone:
          type: string
        caption:
          type: string
        view_once:
          type: boolean
        video:
          type: string
          format: binary
        video_url:
          type: string
        compress:
          type: boolean

    SendAudioRequest:
      type: object
      properties:
        phone:
          type: string
        audio:
          type: string
          format: binary
        audio_url:
          type: string

    SendStickerRequest:
      type: object
      properties:
        phone:
          type: string
        sticker:
          type: string
          format: binary
        sticker_url:
          type: string

    SendContactRequest:
      type: object
      properties:
        phone:
          type: string
        contact_name:
          type: string
        contact_phone:
          type: string

    SendLinkRequest:
      type: object
      properties:
        phone:
          type: string
        link:
          type: string
        caption:
          type: string

    SendLocationRequest:
      type: object
      properties:
        phone:
          type: string
        latitude:
          type: string
        longitude:
          type: string

    SendPollRequest:
      type: object
      properties:
        phone:
          type: string
        question:
          type: string
        options:
          type: array
          items:
            type: string
        max_answer:
          type: integer

    # Response Schemas
    GenericResponse:
      type: object
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
        results:
          type: object
          nullable: true

    SendResponse:
      type: object
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
        results:
          type: object
          properties:
            message_id:
              type: string
            status:
              type: string

    LoginResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            qr_duration:
              type: integer
            qr_link:
              type: string

    LoginWithCodeResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            pair_code:
              type: string

    DeviceResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              device:
                type: string

    UserInfoResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            verified_name:
              type: string
            status:
              type: string
            picture_id:
              type: string

    UserAvatarResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            url:
              type: string
            id:
              type: string

    UserPrivacyResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            group_add:
              type: string
            last_seen:
              type: string
            status:
              type: string
            profile:
              type: string
            read_receipts:
              type: string

    UserGroupResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            data:
              type: array
              items:
                type: object

    NewsletterResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            data:
              type: array
              items:
                type: object

    MyListContactsResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  jid:
                    type: string
                  name:
                    type: string

    UserCheckResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            is_on_whatsapp:
              type: boolean

    BusinessProfileResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            jid:
              type: string
            email:
              type: string
            address:
              type: string

    ChatListResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        results:
          type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Chat'
            pagination:
              $ref: '#/components/schemas/Pagination'

    Chat:
      type: object
      properties:
        jid:
          type: string
        name:
          type: string
        last_message_time:
          type: string
