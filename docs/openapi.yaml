openapi: "3.0.0"
info:
  title: WhatsApp API MultiDevice
  version: 7.0.0
  description: |
    Multi-client WhatsApp Web API with PostgreSQL storage.

    ## Authentication
    All protected routes require JWT Bearer token. Obtain tokens via `/auth/login`.

    ## Multi-Client Architecture
    WhatsApp API routes use the pattern `/api/{phone}/{endpoint}` where `{phone}` is the
    registered client phone number (without + prefix).

    Example: To send a message via client 628192191202:
    ```
    POST /api/628192191202/send/message
    ```
servers:
  - url: http://localhost:3000
tags:
  - name: auth
    description: Authentication and token management
  - name: admin
    description: System administration and client management
  - name: app
    description: WhatsApp connection management (per client)
  - name: user
    description: User information and profile (per client)
  - name: send
    description: Send messages - text, image, file, video, etc. (per client)
  - name: message
    description: Message operations - revoke, react, edit (per client)
  - name: chat
    description: Chat conversations and messaging (per client)
  - name: group
    description: Group management (per client)
  - name: newsletter
    description: Newsletter/channel management (per client)
  - name: history
    description: Chat history synchronization (per client)

paths:
  # ============================================================================
  # Authentication Routes (no auth required for login)
  # ============================================================================
  /auth/login:
    post:
      operationId: authLogin
      tags:
        - auth
      summary: Login with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: yourpassword
              required:
                - username
                - password
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'

  /auth/refresh:
    post:
      operationId: authRefresh
      tags:
        - auth
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
                - refresh_token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthorized'

  /auth/logout:
    post:
      operationId: authLogout
      tags:
        - auth
      summary: Logout and invalidate tokens
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  # ============================================================================
  # Admin Routes
  # ============================================================================
  /admin/storage/stats:
    get:
      operationId: adminStorageStats
      tags:
        - admin
      summary: Get storage statistics
      description: Returns database size, chat count, message count
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageStatsResponse'

  /admin/storage/cleanup:
    post:
      operationId: adminStorageCleanup
      tags:
        - admin
      summary: Cleanup old messages and chats
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pattern:
                  type: string
                  description: JID pattern to match (e.g., "%@g.us" for groups)
                older_than_days:
                  type: integer
                  description: Delete messages older than N days
                empty_chats:
                  type: boolean
                  description: Delete chats with no messages
                dry_run:
                  type: boolean
                  default: false
                  description: Preview changes without deleting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupResponse'

  /admin/storage/vacuum:
    post:
      operationId: adminStorageVacuum
      tags:
        - admin
      summary: Vacuum database to reclaim space
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacuumResponse'

  /admin/storage/chats:
    delete:
      operationId: adminDeleteChats
      tags:
        - admin
      summary: Delete chats by pattern or JIDs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pattern:
                  type: string
                  description: JID pattern to match
                jids:
                  type: array
                  items:
                    type: string
                  description: Specific JIDs to delete
                dry_run:
                  type: boolean
                  default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteChatsResponse'

  /admin/clients:
    get:
      operationId: adminListClients
      tags:
        - admin
      summary: List all WhatsApp clients
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListResponse'

  /admin/clients/{phone}/status:
    get:
      operationId: adminClientStatus
      tags:
        - admin
      summary: Get client connection status
      parameters:
        - $ref: '#/components/parameters/AdminPhonePath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientStatusResponse'

  /admin/clients/{phone}/connect:
    post:
      operationId: adminConnectClient
      tags:
        - admin
      summary: Connect a client
      parameters:
        - $ref: '#/components/parameters/AdminPhonePath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /admin/clients/{phone}/disconnect:
    post:
      operationId: adminDisconnectClient
      tags:
        - admin
      summary: Disconnect a client
      parameters:
        - $ref: '#/components/parameters/AdminPhonePath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  # ============================================================================
  # App Routes (per client)
  # ============================================================================
  /api/{phone}/app/login:
    get:
      operationId: appLogin
      tags:
        - app
      summary: Get QR code for WhatsApp login
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /api/{phone}/app/login-with-code:
    get:
      operationId: appLoginWithCode
      tags:
        - app
      summary: Get pairing code for WhatsApp login
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginWithCodeResponse'

  /api/{phone}/app/logout:
    get:
      operationId: appLogout
      tags:
        - app
      summary: Logout from WhatsApp
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/{phone}/app/reconnect:
    get:
      operationId: appReconnect
      tags:
        - app
      summary: Reconnect to WhatsApp server
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/{phone}/app/devices:
    get:
      operationId: appDevices
      tags:
        - app
      summary: List linked devices
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'

  /api/{phone}/app/status:
    get:
      operationId: appStatus
      tags:
        - app
      summary: Get connection status
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionStatusResponse'

  # ============================================================================
  # User Routes (per client)
  # ============================================================================
  /api/{phone}/user/info:
    get:
      operationId: userInfo
      tags:
        - user
      summary: Get user profile info
      parameters:
        - $ref: '#/components/parameters/PhonePath'
        - name: phone
          in: query
          schema:
            type: string
          example: '6289685028129@s.whatsapp.net'
          description: Target phone number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'

  /api/{phone}/user/avatar:
    get:
      operationId: userAvatar
      tags:
        - user
      summary: Get user avatar
      parameters:
        - $ref: '#/components/parameters/PhonePath'
        - name: phone
          in: query
          schema:
            type: string
          example: '6289685028129@s.whatsapp.net'
        - name: is_preview
          in: query
          schema:
            type: boolean
          example: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAvatarResponse'
    post:
      operationId: userChangeAvatar
      tags:
        - user
      summary: Change your avatar
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/{phone}/user/pushname:
    post:
      operationId: userChangePushName
      tags:
        - user
      summary: Change display name
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                push_name:
                  type: string
                  example: 'John Doe'
              required:
                - push_name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/{phone}/user/my/privacy:
    get:
      operationId: userMyPrivacy
      tags:
        - user
      summary: Get privacy settings
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPrivacyResponse'

  /api/{phone}/user/my/groups:
    get:
      operationId: userMyGroups
      tags:
        - user
      summary: List my groups
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroupResponse'

  /api/{phone}/user/my/newsletters:
    get:
      operationId: userMyNewsletters
      tags:
        - user
      summary: List subscribed channels
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsletterResponse'

  /api/{phone}/user/my/contacts:
    get:
      operationId: userMyContacts
      tags:
        - user
      summary: List contacts
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyListContactsResponse'

  /api/{phone}/user/check:
    get:
      operationId: userCheck
      tags:
        - user
      summary: Check if phone is on WhatsApp
      parameters:
        - $ref: '#/components/parameters/PhonePath'
        - name: phone
          in: query
          required: true
          schema:
            type: string
          example: '628912344551'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCheckResponse'

  /api/{phone}/user/business-profile:
    get:
      operationId: userBusinessProfile
      tags:
        - user
      summary: Get business profile
      parameters:
        - $ref: '#/components/parameters/PhonePath'
        - name: phone
          in: query
          required: true
          schema:
            type: string
          example: '6289685028129@s.whatsapp.net'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfileResponse'

  # ============================================================================
  # Send Routes (per client)
  # ============================================================================
  /api/{phone}/send/message:
    post:
      operationId: sendMessage
      tags:
        - send
      summary: Send text message
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'

  /api/{phone}/send/image:
    post:
      operationId: sendImage
      tags:
        - send
      summary: Send image
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendImageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'

  /api/{phone}/send/file:
    post:
      operationId: sendFile
      tags:
        - send
      summary: Send file/document
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendFileRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'

  /api/{phone}/send/video:
    post:
      operationId: sendVideo
      tags:
        - send
      summary: Send video
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendVideoRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'

  /api/{phone}/send/audio:
    post:
      operationId: sendAudio
      tags:
        - send
      summary: Send audio/voice message
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendAudioRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'

  /api/{phone}/send/sticker:
    post:
      operationId: sendSticker
      tags:
        - send
      summary: Send sticker (auto-converts to WebP)
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendStickerRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'

  /api/{phone}/send/contact:
    post:
      operationId: sendContact
      tags:
        - send
      summary: Send contact card
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendContactRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'

  /api/{phone}/send/link:
    post:
      operationId: sendLink
      tags:
        - send
      summary: Send link with preview
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendLinkRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'

  /api/{phone}/send/location:
    post:
      operationId: sendLocation
      tags:
        - send
      summary: Send location
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendLocationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'

  /api/{phone}/send/poll:
    post:
      operationId: sendPoll
      tags:
        - send
      summary: Send poll
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPollRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'

  /api/{phone}/send/presence:
    post:
      operationId: sendPresence
      tags:
        - send
      summary: Update presence status
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [available, unavailable]
              required:
                - type
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'

  /api/{phone}/send/chat-presence:
    post:
      operationId: sendChatPresence
      tags:
        - send
      summary: Send typing indicator
      parameters:
        - $ref: '#/components/parameters/PhonePath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  example: '6289685024051@s.whatsapp.net'
                action:
                  type: string
                  enum: [start, stop]
              required:
                - phone
                - action
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'

  # ============================================================================
  # Message Routes (per client)
  # ============================================================================
  /api/{phone}/message/{message_id}/reaction:
    post:
      operationId: messageReaction
      tags:
        - message
      summary: React to message
      parameters:
        - $ref: '#/components/parameters/PhonePath'
        - $ref: '#/components/parameters/MessageIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  example: '6289685024051@s.whatsapp.net'
                emoji:
                  type: string
                  example: "🙏"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'

  /api/{phone}/message/{message_id}/revoke:
    post:
      operationId: messageRevoke
      tags:
        - message
      summary: Revoke/unsend message
      parameters:
        - $ref: '#/components/parameters/PhonePath'
        - $ref: '#/components/parameters/MessageIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  example: '6289685024051@s.whatsapp.net'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'

  /api/{phone}/message/{message_id}/delete:
    post:
      operationId: messageDelete
      tags:
        - message
      summary: Delete message locally
      parameters:
        - $ref: '#/components/parameters/PhonePath'
        - $ref: '#/components/parameters/MessageIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  example: '6289685024051@s.whatsapp.net'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'

  /api/{phone}/message/{message_id}/update:
    post:
      operationId: messageUpdate
      tags:
        - message
      summary: Edit message (within 15 minutes)
      parameters:
        - $ref: '#/components/parameters/PhonePath'
        - $ref: '#/components/parameters/MessageIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  example: '6289685024051@s.whatsapp.net'
                message:
                  type: string
                  example: 'Updated message'
              required:
                - phone
                - message
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'

  /api/{phone}/message/{message_id}/read:
    post:
      operationId: messageRead
      tags:
        - message
      summary: Mark message as read
      parameters:
        - $ref: '#/components/parameters/PhonePath'
        - $ref: '#/components/parameters/MessageIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  example: '6289685024051@s.whatsapp.net'
              required:
                - phone
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'

  /api/{phone}/message/{message_id}/star:
    post:
      operationId: messageStar
      tags:
        - message
      summary: Star message
      parameters:
        - $ref: '#/components/parameters/PhonePath'
        - $ref: '#/components/parameters/MessageIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
              required:
                - phone
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/{phone}/message/{message_id}/unstar:
    post:
      operationId: messageUnstar
      tags:
        - message
      summary: Unstar message
      parameters:
        - $ref: '#/components/parameters/PhonePath'
        - $ref: '#/components/parameters/MessageIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
              required:
                - phone
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'

  /api/{phone}/message/{message_id}/download:
    get:
      operationId: messageDownload
      tags:
        - message
      summary: Download media from message
      parameters:
        - $ref: '#/components/parameters/PhonePath'
        - $ref: '#/components/parameters/MessageIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadMediaResponse'

  # ============================================================================
  # Chat Routes (per client)
  # ============================================================================
  /api/{phone}/chats:
    get:
      operationId: chatList
      tags:
        - chat
      summary: List chats
      parameters:
        - $ref: '#/components/parameters/PhonePath'
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: search
          in: query
          schema:
            type: string
        - name: has_media
          in: query
          schema:
            type: boolean
