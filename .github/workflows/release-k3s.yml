name: release-k3s

# Tag-triggered amd64 image build -> ghcr. Deployment to the k3s cluster is owned by
# the PRIVATE gowa-deploy repo (Helm reconcile on its own self-hosted runner); this
# workflow only builds the image and notifies it via repository_dispatch.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/hbinduni/go-whatsapp-web-multidevice

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve and validate version
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::bad tag $REF_NAME"; exit 1; }
          echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Version guard (tag must match src/config/settings.go AppVersion)
        env:
          TAG_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          APP_VERSION="$(grep 'AppVersion[[:space:]]*=' src/config/settings.go \
            | head -1 | sed -n 's/.*"\(v[0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p')"
          [ -n "$APP_VERSION" ] || { echo "::error::could not read AppVersion from src/config/settings.go"; exit 1; }
          [ "$APP_VERSION" = "$TAG_VERSION" ] \
            || { echo "::error::tag $TAG_VERSION != AppVersion $APP_VERSION"; exit 1; }

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build & push image (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/golang.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_BASE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE_BASE }}:latest
          cache-from: type=gha,scope=gowa
          cache-to: type=gha,mode=max,scope=gowa

      - name: Notify gowa-deploy to roll out
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          TAG: ${{ steps.ver.outputs.version }}
        run: |
          gh api repos/hbinduni/gowa-deploy/dispatches \
            -f event_type=deploy -f "client_payload[tag]=$TAG"
