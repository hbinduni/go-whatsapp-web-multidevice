name: Build Docker Image

# Manual-only: images are built and pushed locally (the GHCR package's Actions
# access is granted via UI, which isn't configured). Kept as workflow_dispatch
# so it can be re-enabled by re-adding the `push: tags` trigger once access is
# granted. See DOCKER_VERSIONING.md for the manual release steps.
on:
  workflow_dispatch:

jobs:
  build-and-push:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Login GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          file: ./docker/golang.Dockerfile
          platforms: linux/amd64
          # Single-arch image consumed directly by k8s; skip the OCI provenance
          # attestation so the tag is a plain image manifest, not an index.
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/go-whatsapp-web-multidevice:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/go-whatsapp-web-multidevice:latest
