apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: whatsapp-09

namePrefix: instance-09-

resources:
  - ../../base
  - postgres.yaml

patches:
  - path: namespace-patch.yaml
  - path: secret-patch.yaml
  - path: ingress-patch.yaml

commonLabels:
  app.kubernetes.io/instance: instance-09

commonAnnotations:
  whatsapp.io/instance-id: "09"
