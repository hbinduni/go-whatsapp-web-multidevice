apiVersion: v1
kind: ConfigMap
metadata:
  name: whatsapp-config
  namespace: whatsapp
  labels:
    app.kubernetes.io/name: whatsapp-api
data:
  # Application Settings
  APP_PORT: "3000"
  APP_DEBUG: "false"
  APP_OS: "WhatsAppAPI"

  # Client Settings
  MAX_CLIENTS: "10"

  # WhatsApp Settings
  WHATSAPP_ACCOUNT_VALIDATION: "false"
  WHATSAPP_AUTO_MARK_READ: "false"
  WHATSAPP_AUTO_DOWNLOAD_MEDIA: "true"
  WHATSAPP_CHAT_STORAGE: "true"

  # History Sync
  WHATSAPP_HISTORY_SYNC_ENABLED: "true"
  WHATSAPP_HISTORY_SYNC_ON_LOGIN: "true"
  WHATSAPP_HISTORY_SYNC_MAX_DAYS: "90"

  # FFmpeg Timeouts
  FFMPEG_THUMBNAIL_TIMEOUT: "30"
  FFMPEG_COMPRESS_TIMEOUT: "120"
  FFMPEG_CONVERT_TIMEOUT: "45"

  # Graceful Shutdown
  SHUTDOWN_TIMEOUT: "30"
