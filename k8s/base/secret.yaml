apiVersion: v1
kind: Secret
metadata:
  name: whatsapp-secret
  namespace: whatsapp
  labels:
    app.kubernetes.io/name: whatsapp-api
type: Opaque
stringData:
  # Database - REPLACE WITH YOUR VALUES
  DATABASE_URL: "postgresql://user:password@postgres:5432/whatsapp?sslmode=disable"

  # Authentication - GENERATE NEW VALUES
  # Generate with: openssl rand -base64 32
  AUTH_SECRET: "REPLACE_WITH_RANDOM_SECRET"
  AUTH_USERNAME: "admin"
  # Generate with: htpasswd -nbBC 10 "" yourpassword | tr -d ':\n'
  AUTH_PASSWORD_HASH: "REPLACE_WITH_BCRYPT_HASH"

  # WhatsApp Clients (comma-separated)
  WHATSAPP_CLIENTS: "6281234567890,6281234567891"

  # S3/MinIO Storage
  S3_ENDPOINT: "https://s3.amazonaws.com"
  S3_REGION: "us-east-1"
  S3_ACCESS_KEY_ID: "REPLACE_WITH_ACCESS_KEY"
  S3_SECRET_ACCESS_KEY: "REPLACE_WITH_SECRET_KEY"
  S3_BUCKET: "whatsapp-media"
  S3_FORCE_PATH_STYLE: "false"
  S3_USE_SERVER_PROXY: "false"

  # Webhook (optional)
  WHATSAPP_WEBHOOK: ""
  WHATSAPP_WEBHOOK_SECRET: "webhook-secret"
