apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-api
  namespace: whatsapp
  labels:
    app.kubernetes.io/name: whatsapp-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: whatsapp-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whatsapp-api
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: whatsapp-api
          image: ghcr.io/aldinokemal/go-whatsapp-web-multidevice:latest
          imagePullPolicy: Always
          args: ["rest"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: whatsapp-config
            - secretRef:
                name: whatsapp-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: storage
              mountPath: /app/storages
      volumes:
        - name: storage
          emptyDir: {}
